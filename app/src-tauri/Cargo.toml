[package]
name = "okremote"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
ok-model = { path = "../../crates/ok-model" }
ok-crypto = { path = "../../crates/ok-crypto" }
ok-store = { path = "../../crates/ok-store" }
ok-import = { path = "../../crates/ok-import" }
tauri = { version = "2", features = ["macos-proxy"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
russh = "0.65"
base64 = "0.22"
sha2 = "0.10"
dirs = "5"
async-trait = "0.1"
ironrdp-connector = "0.12"
ironrdp-core = "0.3"
ironrdp-displaycontrol = "0.10"
ironrdp-dvc = "0.10"
ironrdp-graphics = "0.11"
ironrdp-input = "0.9"
ironrdp-pdu = "0.11"
ironrdp-session = "0.13"
ironrdp-svc = "0.10"
ironrdp-tls = { version = "0.3", features = ["rustls"] }
ironrdp-tokio = "0.12"
smallvec = "1"
sspi = "0.23"
