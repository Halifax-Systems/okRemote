[workspace]
resolver = "2"
members = ["crates/ok-model", "crates/ok-crypto", "crates/ok-store", "crates/ok-import", "app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
zeroize = { version = "1", features = ["derive"] }
thiserror = "2"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
panic = "abort"
